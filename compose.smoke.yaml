name: infrastructure-hub-smoke

services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: smoke-root-password
      MARIADB_DATABASE: infrastructure_hub_smoke
      MARIADB_USER: infrastructure_hub
      MARIADB_PASSWORD: smoke-database-password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'healthcheck.sh',
          '--connect',
          '--innodb_initialized'
        ]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - smoke

  redis:
    image: redis:7.4-alpine
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - smoke

  api:
    build:
      context: .
      dockerfile: Dockerfile.app
      target: api
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://infrastructure_hub:smoke-database-password@mariadb:3306/infrastructure_hub_smoke
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ADMIN_EMAIL: smoke-admin@example.com
      ADMIN_PASSWORD: smoke-password-123
      ALLOWED_ORIGINS: http://smoke.test
      API_HOST: 0.0.0.0
      API_PORT: 3000
      COOKIE_SECURE: 'false'
      DATABASE_CONNECT_TIMEOUT_MS: 5000
      DATABASE_OPERATION_TIMEOUT_MS: 5000
      REDIS_CONNECT_TIMEOUT_MS: 5000
      REDIS_COMMAND_TIMEOUT_MS: 3000
      AUTH_PASSWORD_VERIFY_TIMEOUT_MS: 15000
      AUTH_LOGIN_TIMEOUT_MS: 25000
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /home/node
    networks:
      - smoke

  smoke:
    image: node:24-bookworm-slim
    environment:
      AUTH_SMOKE_BASE_URL: http://api:3000
      AUTH_SMOKE_ORIGIN: http://smoke.test
      AUTH_SMOKE_ADMIN_EMAIL: smoke-admin@example.com
      AUTH_SMOKE_ADMIN_PASSWORD: smoke-password-123
      AUTH_SMOKE_TIMEOUT_MS: 30000
    volumes:
      - ./scripts/smoke-auth.mjs:/smoke-auth.mjs:ro
    command: ['node', '/smoke-auth.mjs']
    depends_on:
      api:
        condition: service_healthy
    networks:
      - smoke

networks:
  smoke:
