name: infrastructure-hub

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
  APP_ENCRYPTION_KEY_VERSION: ${APP_ENCRYPTION_KEY_VERSION:-1}
  CLOUDFLARE_API_BASE: ${CLOUDFLARE_API_BASE:-https://api.cloudflare.com/client/v4}
  PUBLIC_IPV4_URL: ${PUBLIC_IPV4_URL:-https://api.ipify.org}
  PUBLIC_IPV6_URL: ${PUBLIC_IPV6_URL:-https://api6.ipify.org}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-5000}
  DATABASE_OPERATION_TIMEOUT_MS: ${DATABASE_OPERATION_TIMEOUT_MS:-5000}
  REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}
  REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-3000}

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - frontend

  api:
    build:
      context: .
      dockerfile: Dockerfile.app
      target: api
    working_dir: /app
    environment:
      <<: *app-environment
      API_HOST: 0.0.0.0
      API_PORT: 3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      COOKIE_NAME: ${COOKIE_NAME:-infra_hub_session}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DB_STARTUP_MAX_ATTEMPTS: ${DB_STARTUP_MAX_ATTEMPTS:-60}
      DB_STARTUP_RETRY_SECONDS: ${DB_STARTUP_RETRY_SECONDS:-2}
      AUTH_PASSWORD_VERIFY_TIMEOUT_MS: ${AUTH_PASSWORD_VERIFY_TIMEOUT_MS:-15000}
      AUTH_LOGIN_TIMEOUT_MS: ${AUTH_LOGIN_TIMEOUT_MS:-25000}
    expose:
      - '3000'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /home/node
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - frontend
      - backend

  worker:
    build:
      context: .
      dockerfile: Dockerfile.app
      target: worker
    working_dir: /app
    environment:
      <<: *app-environment
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /home/node
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'node', '-e', "require('node:fs').accessSync('/tmp/infra-hub-worker-ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'test "$$(redis-cli -a "$${REDIS_PASSWORD}" ping)" = PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

volumes:
  redis-data:

networks:
  frontend:
  backend:
