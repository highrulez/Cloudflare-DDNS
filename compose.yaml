name: cloudflare-ddns-manager

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      APP_PORT: ${APP_PORT:-3000}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      TZ: ${TZ:-Asia/Kuala_Lumpur}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_NAME: ${COOKIE_NAME:-cloudflare_ddns_session}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      CLOUDFLARE_API_BASE: ${CLOUDFLARE_API_BASE:-https://api.cloudflare.com/client/v4}
      IPV4_PROVIDERS: ${IPV4_PROVIDERS:-https://api.ipify.org,https://checkip.amazonaws.com,https://icanhazip.com}
      IPV6_PROVIDERS: ${IPV6_PROVIDERS:-https://api6.ipify.org,https://icanhazip.com}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-5000}
      DATABASE_QUERY_TIMEOUT_MS: ${DATABASE_QUERY_TIMEOUT_MS:-10000}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-10000}
    ports:
      - '${HOST_PORT:-8090}:${APP_PORT:-3000}'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /home/node
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.APP_PORT||3000)+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks:
      - app

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ${DB_NAME:-cloudflare_ddns}
      MARIADB_USER: ${DB_USER:-cloudflare_ddns}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      TZ: ${TZ:-Asia/Kuala_Lumpur}
    volumes:
      - mariadb-data:/var/lib/mysql
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - app

volumes:
  mariadb-data:

networks:
  app:
